#:schema node_modules/wrangler/config-schema.json
# ---------------------------------------------------------------------------
# Cloudflare Pages configuration — Master Zhang Platform
# Deploy: `npx wrangler pages deploy ./dist` (or connect the repo in the
# Cloudflare dashboard with build command `npx astro build`).
# ---------------------------------------------------------------------------

name = "masterzhang-platform"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Non-secret environment variables (available at build AND runtime).
[vars]
PUBLIC_SITE_URL = "https://masterzhang.ca"
PUBLIC_BUSINESS_PHONE = "+14168463253"
PUBLIC_SERVICE_REGION = "Markham & York Region, ON"

# ---------------------------------------------------------------------------
# SECRETS — do NOT put these in this file. Set them via:
#   npx wrangler pages secret put QUOTE_WEBHOOK_URL   (Slack/Discord/Make.com)
#   npx wrangler pages secret put RESEND_API_KEY      (transactional email)
#   npx wrangler pages secret put QUOTE_DESTINATION_EMAIL
# They are read at runtime from `locals.runtime.env` inside /api/quote.
# ---------------------------------------------------------------------------
